# Extra: Der Container braucht mehr Speicher als erlaubt. Ergebnis: OOMKilled.
# Eigene Namen (oom), damit nichts mit hallo kollidiert. Auch fuer Demo 2.3g.
apiVersion: apps/v1
kind: Deployment
metadata:
  # FREI.
  name: oom
  # FREI: nur zum Filtern.
  labels:
    app: oom
spec:
  replicas: 1
  # PASST ZU: template.metadata.labels.
  selector:
    matchLabels:
      app: oom
  template:
    metadata:
      labels:
        app: oom
    spec:
      containers:
        # FREI.
        - name: oom
          # PASST ZU: geladenem Image hallo-app:1.0.
          image: hallo-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # FEST: Die JVM belegt beim Start sofort 200 MiB.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms200m -XX:+AlwaysPreTouch"
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            # Absichtlich zu klein: 128Mi < 200 MiB.
            limits:
              memory: 128Mi
