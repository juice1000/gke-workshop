# Lab 3, Fall 2: absichtlich mit genau einem Fehler.
# Bewusst ohne Feldkommentare, damit die Datei den Fehler nicht verraet.
# Bezuege wie in lab02-hallo-app/betrieb/deployment.yaml. Name und Label
# fall2 sind frei, aber eigene, damit sich die Faelle nicht stoeren.
# Loesung fuer den Trainer: loesungen/fall2.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fall2
  labels:
    app: fall2
spec:
  replicas: 1
  revisionHistoryLimit: 5
  minReadySeconds: 3
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fall2
  template:
    metadata:
      labels:
        app: fall2
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: fall2
          image: hallo-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: fall2-config
                  key: GREETING
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
