# PodDisruptionBudget: Bei geplanten Unterbrechungen (kubectl drain) bleibt
# mindestens ein Pod von hallo laufen. Schuetzt nicht vor Abstuerzen.

# FEST
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  # FREI.
  name: hallo-pdb
spec:
  # FREI, aber kleiner als replicas. Sonst blockiert es jedes drain.
  minAvailable: 1
  # PASST ZU: Pod-Labels im Deployment hallo.
  selector:
    matchLabels:
      app: hallo
