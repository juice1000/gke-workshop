---
# Lab 6 Etappe D: Welches Secret aus Google Secret Manager als Datei in den Pod
# kommt. Der CSI-Treiber des GKE-Add-ons liest es beim Start des Pods.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  # PASST ZU: volumeAttributes.secretProviderClass im Deployment.
  name: hallo-db
  labels:
    workshop-lab: "06"
spec:
  # FEST: Anbieter des GKE-Add-ons.
  provider: gke
  parameters:
    secrets: |
      # resourceName: Projekt, Secret-Name, Version. pipeline.sh setzt $PROJECT_ID ein.
      - resourceName: "projects/WORKSHOP_PROJECT/secrets/hallo-db/versions/latest"
        # PASST ZU: Dateiname, den die Anwendung unter /var/secrets sucht.
        path: "DB_PASSWORT"
