---
# Lab 6 Etappe D: hallo holt DB_PASSWORT aus Google Secret Manager, als Datei.
# Kein kubectl create secret mehr.
#
#   serviceaccount.yaml hallo --------------> serviceAccountName
#   secretproviderclass.yaml hallo-db ------> volumes[].csi.volumeAttributes
#   Datei /var/secrets/DB_PASSWORT ---------> Startzeile "DB_PASSWORT aus Datei /var/secrets"
#   sed setzt $IMAGE ein --------------------> image: WORKSHOP_IMAGE

# FEST
apiVersion: apps/v1
kind: Deployment
metadata:
  # PASST ZU: ../stoerungen/ und deployment/hallo.
  name: hallo
  # FREI: nur zum Filtern.
  labels:
    workshop-lab: "06"
    app: hallo
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 3
  # FREI: hoeher als lokal, der erste Image-Download dauert.
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # PASST ZU: template.metadata.labels. Nicht aenderbar.
  selector:
    matchLabels:
      app: hallo
  template:
    metadata:
      # PASST ZU: selector oben und service.yaml.
      labels:
        app: hallo
    spec:
      # PASST ZU: serviceaccount.yaml. Nur dieses Konto darf das Secret lesen.
      serviceAccountName: hallo
      # FEST auf GKE Standard: nur Nodes mit Metadatenserver fuer Workload Identity.
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
      terminationGracePeriodSeconds: 30
      containers:
        # PASST ZU: "kubectl set image deployment/hallo hallo=...".
        - name: hallo
          # PASST ZU: sed ersetzt dies durch $IMAGE aus Lab 4.
          image: WORKSHOP_IMAGE
          imagePullPolicy: IfNotPresent
          # Vor dem Stoppen 10 s warten: So nimmt der Load Balancer des Gateways
          # den Pod erst aus dem Verkehr. Ohne das gibt es beim Rollout 503.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          ports:
            - containerPort: 8080
          env:
            # FEST: Pod-Name in der Antwort.
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # FEST: Die Anwendung liest GREETING.
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  # PASST ZU: name und Schluessel in configmap.yaml.
                  name: hallo-config
                  key: GREETING
          volumeMounts:
            # PASST ZU: volumes unten. Die Anwendung liest /var/secrets/DB_PASSWORT.
            - name: secrets
              mountPath: /var/secrets
              readOnly: true
          # FREI: Auf GKE plant der Scheduler alle Teilnehmenden danach.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
          # Probes. path: FEST. port: PASST ZU 8080.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: secrets
          csi:
            # FEST: Treiber des Secret-Manager-Add-ons.
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              # PASST ZU: metadata.name in secretproviderclass.yaml.
              secretProviderClass: hallo-db
