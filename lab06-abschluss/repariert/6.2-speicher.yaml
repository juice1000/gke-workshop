# Lab 6, Stoerung 6.2 repariert. Bezuege wie in ../loesung/deployment.yaml.
# Der entscheidende Bezug: Das Speicherlimit PASST ZU der JVM: -Xms512m -Xmx512m belegen schon
# 512 MiB Heap, dazu kommt JVM-Nebenspeicher. Deshalb 1Gi statt 512Mi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hallo
  labels:
    app: hallo
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hallo
  template:
    metadata:
      labels:
        app: hallo
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: hallo
          image: WORKSHOP_IMAGE
          imagePullPolicy: IfNotPresent
          # Vor dem Stoppen 10 s warten: So nimmt der Load Balancer des Gateways
          # den Pod erst aus dem Verkehr. Ohne das gibt es beim Rollout 503.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          ports:
            - containerPort: 8080
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: hallo-config
                  key: GREETING
            - name: DB_PASSWORT
              valueFrom:
                secretKeyRef:
                  name: hallo-secret
                  key: DB_PASSWORT
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx512m -XX:+AlwaysPreTouch"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
