---
# Extra: drei Pods auf verschiedene Nodes verteilen.
# Anwenden: sed "s#WORKSHOP_IMAGE#$IMAGE#" lab04-gke/extra/spread.yaml | kubectl apply -f -
# app=hallo-spread muss in selector, Pod-Labels und labelSelector gleich sein.

apiVersion: apps/v1
kind: Deployment
metadata:
  # FREI.
  name: hallo-spread
  # FREI: nur zum Filtern.
  labels:
    app: hallo-spread
spec:
  replicas: 3
  # PASST ZU: Pod-Labels. Nicht app: hallo, sonst mischt es sich mit hallo.
  selector:
    matchLabels:
      app: hallo-spread
  template:
    metadata:
      # PASST ZU: selector oben und labelSelector unten.
      labels:
        app: hallo-spread
    spec:
      # Pro Node hoechstens 1 Pod Unterschied. Sonst bleibt der Pod Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          # FEST: Hostname-Label jedes Nodes.
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # PASST ZU: Pod-Labels. Welche Pods gezaehlt werden.
          labelSelector:
            matchLabels:
              app: hallo-spread
      containers:
        - name: hallo
          # PASST ZU: sed ersetzt dies durch $IMAGE aus Lab 4.
          image: WORKSHOP_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Klein, weil sich alle Teilnehmenden die Nodes teilen.
          resources:
            requests:
              cpu: 10m
              memory: 384Mi
            limits:
              memory: 384Mi
