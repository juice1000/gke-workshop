# Service fuer GKE: ClusterIP, keine oeffentliche Adresse. Zugriff per port-forward.
apiVersion: v1
kind: Service
metadata:
  # PASST ZU: port-forward service/hallo.
  name: hallo
spec:
  # PASST ZU: template.metadata.labels in deployment.yaml.
  selector:
    app: hallo
  ports:
    # port: FREI. targetPort: PASST ZU containerPort.
    - port: 80
      targetPort: 8080
