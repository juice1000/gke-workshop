# Rechte pro Person. Nur fuer den Trainer. Namespace und Konto ersetzen.
# Role sagt WAS, RoleBinding sagt WER. Erst beides gibt ein Recht.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  # PASST ZU: roleRef.name unten.
  name: workshop-entwickler
  # PASST ZU: namespace.yaml. Rechte gelten nur hier.
  namespace: workshop-person01
# FEST: Namen aus der Kubernetes-API. "" ist die Kerngruppe.
# Was fehlt, ist verboten.
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Lab 4 Extra 4: eigene Route am Gateway.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  # FREI.
  name: workshop-entwickler
  # PASST ZU: namespace der Role.
  namespace: workshop-person01
# PASST ZU: Google-Konto der Person.
subjects:
  - kind: User
    name: TEILNEHMER_KONTO_ERSETZEN
    apiGroup: rbac.authorization.k8s.io
# PASST ZU: Role oben. Nicht aenderbar.
roleRef:
  kind: Role
  name: workshop-entwickler
  apiGroup: rbac.authorization.k8s.io
