# Vor dem Anwenden Namespace und Konto ersetzen. Nur fuer den Trainer.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workshop-entwickler
  namespace: workshop-person01
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Lab 4 Extra 4: eigene Route am gemeinsamen Gateway (trainer/gateway.yaml).
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workshop-entwickler
  namespace: workshop-person01
subjects:
  - kind: User
    name: TEILNEHMER_KONTO_ERSETZEN
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: workshop-entwickler
  apiGroup: rbac.authorization.k8s.io
