# Kontingent pro Namespace. Nur fuer den Trainer. Vor dem Anwenden NN ersetzen
# (teilnehmer-anlegen.sh macht das).
#
# Nur ein Sicherheitsnetz gegen Versehen wie "kubectl scale --replicas=50".
# Keine Uebung darf daran scheitern: Die groesste braucht etwa 1 CPU
# (Lab 4 Extra 3: 3 + 1 Pods je 250m, dazu verkehr). Die Grenzen liegen
# mit Absicht weit darueber.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kurs
  namespace: workshop-person01
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    pods: "20"
    # Kein eigener oeffentlicher Load Balancer: externe Adressen sind im
    # Projekt knapp (IN_USE_ADDRESSES 8). Der Weg nach aussen ist das Gateway.
    services.loadbalancers: "0"
---
# Nur Standard-Requests, keine Standard-Limits: Ein Pod ohne resources wird
# angenommen, statt am Kontingent zu scheitern. Ein Standard-Speicherlimit
# wuerde die JVM ungefragt beenden, deshalb fehlt es mit Absicht.
apiVersion: v1
kind: LimitRange
metadata:
  name: kurs
  namespace: workshop-person01
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
