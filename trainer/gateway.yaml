# Gemeinsamer Eingang von aussen fuer alle Teilnehmenden. Nur fuer den Trainer.
# Voraussetzung: Gateway API im Cluster aktiv
#   gcloud container clusters update workshop --gateway-api=standard \
#     --zone=europe-west3-b --project=lookbeyond-gke-workshop
# Legt EINEN externen HTTP-Load-Balancer mit einer oeffentlichen Adresse an.
# Kosten laufen, solange das Gateway existiert. Nach dem Kurstag loeschen:
#   kubectl --context "$GKE_CONTEXT" delete -f trainer/gateway.yaml
#
#   Gateway workshop/workshop-gateway <-- parentRefs in jeder HTTPRoute
#   Label workshop=gke-einfuehrung    <-- trainer/einrichtung/namespace.yaml (Teilnehmer)
apiVersion: v1
kind: Namespace
metadata:
  # FREI. PASST ZU: parentRefs[].namespace in lab04-gke/gateway/httproute.yaml.
  name: workshop-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # PASST ZU: parentRefs[].name in lab04-gke/gateway/httproute.yaml.
  name: workshop
  namespace: workshop-gateway
spec:
  # FEST: globaler externer Application Load Balancer von GKE.
  # Braucht kein Proxy-only-Subnetz.
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    # Nur HTTP auf Port 80. Kein Zertifikat, keine Domain.
    - name: http
      protocol: HTTP
      port: 80
      # Routen aus allen Kurs-Namespaces werden angenommen, andere nicht.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              # PASST ZU: labels in trainer/einrichtung/namespace.yaml.
              workshop: gke-einfuehrung
