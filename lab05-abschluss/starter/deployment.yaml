apiVersion: apps/v1
kind: Deployment
metadata:
  # PASST ZU: deployment/hallo in Befehlen, pruefen.py, Name der Releases.
  name: hallo
  labels:
    app: hallo
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # PASST ZU: template.metadata.labels darunter.
  selector:
    matchLabels:
      app: hallo
  template:
    metadata:
      # PASST ZU: selector oben und selector in service.yaml.
      labels:
        app: hallo
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: hallo
          # PASST ZU: dem Wert von $IMAGE (Pfad aus docker push, Version 2.0).
          image: TODO_IMAGE  # TODO: Registry-Pfad mit Version 2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            # PASST ZU: server.port=8080 der Anwendung.
            - containerPort: 8080
