apiVersion: apps/v1
kind: Deployment
metadata:
  name: hallo
  labels:
    app: hallo
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hallo
  template:
    metadata:
      labels:
        app: hallo
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: hallo
          image: TODO_IMAGE  # TODO: Registry-Pfad mit Version 2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 8080
          # TODO: GREETING aus hallo-config, Schluessel GREETING.
          # TODO: DB_PASSWORT aus hallo-secret, Schluessel DB_PASSWORT.
          # TODO: requests cpu 250m, memory 512Mi; limits memory 512Mi.
          # TODO: startupProbe: /actuator/health/liveness, Port 8080,
          #       periodSeconds 5, failureThreshold 30, timeoutSeconds 2.
          # TODO: readinessProbe: /actuator/health/readiness, Port 8080,
          #       periodSeconds 5, failureThreshold 3, timeoutSeconds 2.
          # TODO: livenessProbe: /actuator/health/liveness, Port 8080,
          #       periodSeconds 10, failureThreshold 3, timeoutSeconds 2.
