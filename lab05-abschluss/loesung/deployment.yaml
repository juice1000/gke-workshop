# Lab 5, Ausgangsloesung: so sollte out/lab05/starter/deployment.yaml nach
# den TODOs aussehen. Aufbau wie lab02-hallo-app/betrieb/deployment.yaml,
# dort sind alle Felder einzeln erklaert. Hier nur die Bezuege.
# Legende FEST, FREI, PASST ZU: siehe Kopf von lab02-hallo-app/k8s/deployment.yaml.
#
#   service.yaml    selector app=hallo -----> template.metadata.labels
#   configmap.yaml  name hallo-config ------> configMapKeyRef.name
#                   data GREETING ----------> configMapKeyRef.key
#   kubectl create secret generic hallo-secret --from-literal=DB_PASSWORT=...
#                   (Lab 5, Start) ---------> secretKeyRef.name und .key
#   render.py lab05-abschluss --image "$IMAGE" -> ersetzt WORKSHOP_IMAGE
#
# Die Releases A, B und C in ../releases/ tragen denselben Namen hallo und
# dieselben Labels. Deshalb aendert jedes "apply" eines Release genau dieses
# Deployment per Rolling Update, statt ein zweites anzulegen.
# Kein Namespace in der Datei: Er kommt aus eurem Kontext (workshop-personNN).

# FEST
apiVersion: apps/v1
kind: Deployment
metadata:
  # PASST ZU: metadata.name in ../releases/ und ../repariert/, deployment/hallo
  # in Befehlen, scripts/pruefen.py (Stufe abschluss).
  name: hallo
  # FREI: nur zum Filtern.
  labels:
    app: hallo
spec:
  # FREI (Wert)
  replicas: 2
  # FREI (Werte)
  revisionHistoryLimit: 5
  minReadySeconds: 3
  # FREI (Wert). Hoeher als lokal: Der erste Image-Download aus der Registry
  # kann auf GKE laenger dauern.
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # PASST ZU: template.metadata.labels. Unveraenderlich nach dem Anlegen.
  selector:
    matchLabels:
      app: hallo
  template:
    metadata:
      # PASST ZU: selector oben, selector in service.yaml, -l app=hallo.
      labels:
        app: hallo
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        # PASST ZU: kubectl set image deployment/hallo hallo=..., pruefen.py.
        - name: hallo
          # PASST ZU: Platzhalter fuer scripts/render.py. Wird ersetzt durch den
          # Inhalt von $IMAGE (der Pfad aus "docker push", Version 2.0):
          # REGION-docker.pkg.dev/PROJEKT/REPO/hallo-app-NAMESPACE:2.0
          # Unersetzt: InvalidImageName oder ErrImagePull.
          image: WORKSHOP_IMAGE
          # FEST (Wertauswahl). Auf GKE fehlt das Image beim ersten Start,
          # dann laedt der Node es aus der Registry.
          imagePullPolicy: IfNotPresent
          ports:
            # PASST ZU: server.port=8080 der Anwendung.
            - containerPort: 8080
          env:
            # FEST: Die Anwendung liest HOSTNAME.
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # FEST: Die Anwendung liest GREETING.
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  # PASST ZU: metadata.name in configmap.yaml.
                  name: hallo-config
                  # PASST ZU: Schluessel unter data in configmap.yaml.
                  key: GREETING
            # name: FREI. Die Anwendung liest DB_PASSWORT nicht, pruefen.py
            #   erwartet den Namen aber.
            - name: DB_PASSWORT
              valueFrom:
                secretKeyRef:
                  # PASST ZU: Name im Befehl "kubectl create secret generic
                  # hallo-secret ..." aus dem Lab-5-Start.
                  name: hallo-secret
                  # PASST ZU: Schluessel in --from-literal=DB_PASSWORT=...
                  key: DB_PASSWORT
          # FREI (Werte). Auf GKE wichtig: Der Scheduler plant alle
          # Teilnehmenden nach diesen Requests auf die gemeinsamen Nodes.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          # Probes: path FEST (Spring Boot Actuator), port PASST ZU server.port,
          # Zeiten FREI.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
