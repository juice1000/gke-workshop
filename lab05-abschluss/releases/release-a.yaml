# Lab 5, Release A: absichtlich mit einem Fehler.
# Bewusst ohne Feldkommentare, damit die Datei den Fehler nicht verraet.
# Gleicher Name hallo und gleiche Labels wie ../loesung/deployment.yaml:
# "apply" aendert das laufende Deployment per Rolling Update.
# Korrigierte Fassung fuer den Trainer: ../repariert/release-a.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hallo
  labels:
    app: hallo
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hallo
  template:
    metadata:
      labels:
        app: hallo
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: hallo
          image: WORKSHOP_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: hallo-config
                  key: GRUSS
            - name: DB_PASSWORT
              valueFrom:
                secretKeyRef:
                  name: hallo-secret
                  key: DB_PASSWORT
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
