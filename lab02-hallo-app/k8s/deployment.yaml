# Deployment Tag 1: haelt zwei Pods der hallo-app am Laufen.
#
# Legende fuer alle Manifeste:
#   FEST      von Kubernetes oder der Anwendung vorgegeben
#   FREI      frei waehlbar, nichts verweist darauf
#   PASST ZU  frei waehlbar, muss aber an der genannten Stelle gleich lauten
#
#   service.yaml selector app=hallo --> template.metadata.labels app=hallo
#   service.yaml targetPort 8080 -----> containerPort 8080

# FEST
apiVersion: apps/v1
kind: Deployment
metadata:
  # PASST ZU: deployment/hallo in Befehlen und betrieb/deployment.yaml.
  name: hallo
  # FREI: nur zum Filtern, niemand selektiert darauf.
  labels:
    app: hallo
spec:
  # FREI: Anzahl Pods.
  replicas: 2
  # PASST ZU: template.metadata.labels. Nach dem Anlegen nicht aenderbar.
  selector:
    matchLabels:
      app: hallo
  # Vorlage fuer jeden Pod.
  template:
    metadata:
      # PASST ZU: selector oben und selector in service.yaml.
      labels:
        app: hallo
    spec:
      containers:
        # PASST ZU: "kubectl set image deployment/hallo hallo=...".
        - name: hallo
          # PASST ZU: docker build -t und minikube image load. Sonst ErrImagePull.
          image: hallo-app:1.0
          # FEST: lokales Image nehmen, nicht aus dem Internet laden.
          imagePullPolicy: IfNotPresent
          env:
            # FEST: Die Anwendung zeigt HOSTNAME an. Wert = Pod-Name.
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # PASST ZU: server.port der Anwendung. Nur Information.
          ports:
            - containerPort: 8080
