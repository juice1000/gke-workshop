# Service: fester Name "hallo" fuer alle Pods mit app=hallo.
# Typ ClusterIP: nur im Cluster erreichbar, von aussen per port-forward.

# FEST
apiVersion: v1
kind: Service
metadata:
  # PASST ZU: port-forward service/hallo und DNS-Name http://hallo.
  name: hallo
spec:
  # PASST ZU: template.metadata.labels in deployment.yaml (Pod-Labels).
  selector:
    app: hallo
  ports:
    # port: FREI, Port des Service. targetPort: PASST ZU containerPort.
    - port: 80
      targetPort: 8080
