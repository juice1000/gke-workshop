# Extra: passt die Zahl der Pods an die CPU-Last an (2 bis 4).
# Braucht lokal: minikube addons enable metrics-server.
#
#   ../betrieb/deployment.yaml name hallo --> scaleTargetRef.name
#   requests.cpu 250m ----------------------> Basis der 50 Prozent

# FEST
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # FREI.
  name: hallo
spec:
  # PASST ZU: apiVersion, kind und name des Deployments.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hallo
  # FREI.
  minReplicas: 2
  maxReplicas: 4
  # Ziel: 50 Prozent der CPU-Requests. Ohne Requests: <unknown>.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
