# Extra: Service vom Typ NodePort. Von aussen erreichbar, ohne Tunnel.
# Mit Docker-Treiber nur, wenn minikube mit --ports=127.0.0.1:30080:30080
# gestartet wurde (README, 2.4). Der Service hallo bleibt ClusterIP.

# FEST
apiVersion: v1
kind: Service
metadata:
  # FREI, aber nicht hallo.
  name: hallo-nodeport
spec:
  # FEST: oeffnet denselben Port auf jedem Node.
  type: NodePort
  # PASST ZU: template.metadata.labels in deployment.yaml.
  selector:
    app: hallo
  ports:
    # port: FREI. targetPort: PASST ZU containerPort.
    # nodePort: 30000 bis 32767, PASST ZU minikube start --ports.
    - port: 80
      targetPort: 8080
      nodePort: 30080
